# DMujeres Traccar Platform — entorno de desarrollo
# Uso: ./infrastructure/scripts/dev.sh up  (requiere .env)
# SEGURIDAD DEV: todos los puertos bindean 127.0.0.1 (solo alcanzables localmente).
# Para accesos externos (tests con teléfono físico en Fase 3): abrir puertos con
# firewall explícito (ufw) y NUNCA exponer el dashboard EMQX (18083) fuera.

services:

  database:
    image: timescale/timescaledb:latest-pg17
    container_name: dmj-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traccar}
      POSTGRES_USER: ${POSTGRES_USER:-traccar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido en .env}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dmj-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traccar} -d ${POSTGRES_DB:-traccar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dmj-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dmj-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: emqx/emqx:5.8.5
    container_name: dmj-mqtt
    restart: unless-stopped
    environment:
      EMQX_NODE_NAME: dmj-mqtt@127.0.0.1
      EMQX_TELEMETRY_ENABLED: "false"
      # Dev: conexiones anónimas permitidas SOLO porque 1883/8083 bindean 127.0.0.1.
      # MOTIVO: infrastructure/load-tests (mqtt-baseline / mqtt-e2e) conectan hoy sin
      # credenciales; desactivar anónimo los rompería. Para auth+ACL en dev usar el
      # override documentado: docker-compose.emqx-auth.yml (monta auth-file + acl-file).
      # NOTA EMQX 5.8: `EMQX_ALLOW_ANONYMOUS` NO es una clave válida del schema (es
      # ignorada). El anonimato lo controla la cadena de autenticación: al no haber
      # authentication{...} configurada, cualquiera conecta. Mantener esta línea es
      # inofensivo pero no tiene efecto; no hay que "desactivarla": hay que añadir el
      # authenticator (ver docker-compose.emqx-auth.yml).
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    ports:
      - "127.0.0.1:1883:1883"    # MQTT
      - "127.0.0.1:8083:8083"    # MQTT/WebSocket
      - "127.0.0.1:18083:18083"  # Dashboard admin EMQX (solo local en dev)
    volumes:
      - dmj-mqttdata:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  dmj-pgdata:
  dmj-redisdata:
  dmj-mqttdata: