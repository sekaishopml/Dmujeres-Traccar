# DMujeres Traccar Platform — entorno de desarrollo
# Uso: ./infrastructure/scripts/dev.sh up  (requiere .env)
# SEGURIDAD DEV: todos los puertos bindean 127.0.0.1 (solo alcanzables localmente).
# Para accesos externos (tests con teléfono físico en Fase 3): abrir puertos con
# firewall explícito (ufw) y NUNCA exponer el dashboard EMQX (18083) fuera.

services:

  database:
    image: timescale/timescaledb:latest-pg17
    container_name: dmj-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traccar}
      POSTGRES_USER: ${POSTGRES_USER:-traccar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido en .env}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dmj-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traccar} -d ${POSTGRES_DB:-traccar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dmj-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dmj-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: emqx/emqx:5.8.5
    container_name: dmj-mqtt
    restart: unless-stopped
    environment:
      EMQX_NODE_NAME: dmj-mqtt@127.0.0.1
      EMQX_TELEMETRY_ENABLED: "false"
      # --- Autenticación PERMANENTE (EMQX 5.8): password_based + bootstrap CSV ---
      # Sin anónimo: en EMQX 5.x el anonimato lo controla (a) la presencia de la
      # cadena `authentication` y (b) `authorization.no_match`. Con autenticador
      # presente + no_match=deny, toda conexión sin credenciales válidas se rechaza.
      # NOTA: `EMQX_ALLOW_ANONYMOUS` NO es clave válida del schema 5.8 (se ignora).
      EMQX_AUTHENTICATION__1__MECHANISM: "password_based"
      EMQX_AUTHENTICATION__1__BACKEND: "built_in_database"
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: "username"
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME: "sha256"
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__SALT_POSITION: "prefix"
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: "/opt/emqx/etc/auth-file.csv"
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: "hash"
      # --- Autorización (ACL por archivo): todo lo no listado, denegado ---
      EMQX_AUTHORIZATION__NO_MATCH: "deny"
      EMQX_AUTHORIZATION__DENY_ACTION: "ignore"
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: "file"
      EMQX_AUTHORIZATION__SOURCES__1__PATH: "/opt/emqx/etc/acl-file.conf"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    ports:
      - "1883:1883"    # MQTT (acceso externo para la app; ver nota de seguridad)
      - "127.0.0.1:8083:8083"    # MQTT/WebSocket (solo local)
      - "127.0.0.1:18083:18083"  # Dashboard admin EMQX (solo local en dev)
    volumes:
      - dmj-mqttdata:/opt/emqx/data
      # Credenciales SOLO dev (auth-file.csv NO debe versionar secretos reales;
      # producción: generar con infrastructure/scripts/mqtt-users.sh)
      - ../emqx/auth-file.csv:/opt/emqx/etc/auth-file.csv:ro
      - ../emqx/acl-file.conf:/opt/emqx/etc/acl-file.conf:ro
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  dmj-pgdata:
  dmj-redisdata:
  dmj-mqttdata: