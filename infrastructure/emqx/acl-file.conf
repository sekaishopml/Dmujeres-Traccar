%% EMQX 5.8 ACL por archivo — canal MQTT móvil dmj
%%
%% Reglas evaluadas en orden; la primera que hace match gana.
%% Formato: {perm(), who(), action(), [topic_filter()]}.
%% Referencia completa del formato: etc/acl.conf de la imagen o docs oficiales.
%%
%% Modelo de topics (diseño: el username ES el deviceId):
%%   publish   (móvil):   dmj/v1/devices/{username}/telemetry
%%   subscribe (móvil):   dmj/v1/devices/{username}/ack
%%   subscribe (server):  dmj/v1/devices/+/telemetry
%%   publish   (server):  dmj/v1/devices/{deviceId}/ack
%%
%% Principios:
%%   - El server (dmj-consumer) NO publica telemetry ni se suscribe a acks ajenos.
%%   - Cada móvil publica SOLO en dmj/v1/devices/${username}/telemetry y se suscribe
%%     SOLO a dmj/v1/devices/${username}/ack. Sin wildcards para móviles: el
%%     placeholder ${username} se sustituye por el usuario autenticado, así que
%%     subscribirse a dmj/v1/devices/+/telemetry NO casa con estas reglas.
%%   - `authorization.no_match = deny` (compose) + {deny, all} final: todo lo no
%%     listado queda denegado, incluido $SYS/#.

%% --- Server consumer (cliente MQTT de Traccar) -------------------------------
{allow, {username, "dmj-consumer"}, subscribe, ["dmj/v1/devices/+/telemetry"]}.
{allow, {username, "dmj-consumer"}, publish, ["dmj/v1/devices/+/ack"]}.

%% --- Dispositivos móviles -----------------------------------------------------
%% El topic se deriva del username autenticado (validado en EMQX 5.8.5).
%% `all` cubre a cualquier usuario autenticado; ${username} ata el topic al usuario.
{allow, all, publish, ["dmj/v1/devices/${username}/telemetry"]}.
{allow, all, subscribe, ["dmj/v1/devices/${username}/ack"]}.

%% --- Denegar el resto (incluye $SYS/# y cualquier otro topic) ------------------
{deny, all}.

%% PRODUCCIÓN (recomendaciones):
%%   - Mantener {deny, all} y authorization.no_match = deny.
%%   - No versionar credenciales reales en auth-file.csv; generarlas con
%%     infrastructure/scripts/mqtt-users.sh y montar el archivo resultante.
%%   - Si se exige explícitamente negar $SYS/# (defensa en profundidad), añadir:
%%     {deny, all, subscribe, ["$SYS/#"]}.
%%   - Alta rotación por dispositivo sin editar este archivo: el placeholder
%%     ${username} ya ata cada móvil a su propio topic; alternativas más estrictas:
%%     (a) who() = {username, {re, "^[a-z0-9]+-[0-9]{3}$"}} para restringir el
%%         patrón de username; (b) reglas explícitas por username.
