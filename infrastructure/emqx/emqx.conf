# =============================================================================
# EMQX 5.8 — autenticación y autorización (ACL) para el canal MQTT móvil dmj
# =============================================================================
#
# IMPORTANTE (EMQX 5.x): este archivo es la referencia HOCON de la configuración
# de acceso. En docker-compose se aplica vía variables de entorno (EMQX_*) porque
# así se evita reemplazar /opt/emqx/etc/emqx.conf completo de la imagen. La forma
# por archivo existe solo como plantilla montable si se prefiere configuración
# declarativa (ver abajo "Montar este archivo").
#
# Referencia oficial EMQX 5.8:
#   - AuthN password_based + built_in_database (bootstrap CSV):
#     https://docs.emqx.com/en/emqx/latest/access-control/authn/mnesia.html
#   - AuthZ file (ACL): https://docs.emqx.com/en/emqx/latest/access-control/authz/file.html
#
# Validado empíricamente contra emqx/emqx:5.8.5 (docker), ver docs/mqtt/emqx-security.md.
#
# Compatibilidad 5.x detectada:
#   - `EMQX_ALLOW_ANONYMOUS` NO existe en el schema de 5.8: es ignorado.
#     El anonimato se controla por: (a) cadena de autenticación presente/ausente y
#     (b) `authorization.no_match` (allow|deny).
#   - El backend de authN por archivo es `built_in_database` con `bootstrap_file`
#     (CSV) y `bootstrap_type = hash`; NO existe `backend = file`.
#   - NO existe comando `emqx ctl` para gestionar usuarios MQTT en 5.8; se usa la
#     API HTTP (/api/v5/authentication/{id}/users) o el dashboard. Ver
#     infrastructure/scripts/mqtt-users.sh.

node {
  # Valores por defecto de la imagen; si montas este archivo debes mantenerlos.
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

# Listeners por defecto de la imagen (tcp 1883, ssl 8883, ws 8083, wss 8084).
# Se reutilizan tal cual; este template NO redefine binds para no pisar defaults.
# ssl:default (8883) ya está habilitado por defecto en la imagen; solo se apuntan
# los certificados (ver docker-compose.prod.yml con EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__*).

# -----------------------------------------------------------------------------
# Autenticación: password_based, backend archivo (built_in_database + bootstrap)
# -----------------------------------------------------------------------------
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm {
      name = sha256
      salt_position = prefix
    }
    # CSV bootstrap con columnas: user_id,password_hash,salt,is_superuser
    # (credenciales de ejemplo SOLO dev en auth-file.csv; producción: mqtt-users.sh)
    bootstrap_file = "/opt/emqx/etc/auth-file.csv"
    bootstrap_type = hash
  }
]

# -----------------------------------------------------------------------------
# Autorización: ACL por archivo, no_match = deny
# -----------------------------------------------------------------------------
authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = file
      path = "/opt/emqx/etc/acl-file.conf"
      enable = true
    }
  ]
}

# -----------------------------------------------------------------------------
# Equivalencias con docker-compose (variables de entorno, MÁS prioridad que file):
#   EMQX_AUTHENTICATION__1__MECHANISM=password_based
#   EMQX_AUTHENTICATION__1__BACKEND=built_in_database
#   EMQX_AUTHENTICATION__1__USER_ID_TYPE=username
#   EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME=sha256
#   EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__SALT_POSITION=prefix
#   EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE=/opt/emqx/etc/auth-file.csv
#   EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE=hash
#   EMQX_AUTHORIZATION__NO_MATCH=deny
#   EMQX_AUTHORIZATION__DENY_ACTION=ignore
#   EMQX_AUTHORIZATION__SOURCES__1__TYPE=file
#   EMQX_AUTHORIZATION__SOURCES__1__PATH=/opt/emqx/etc/acl-file.conf
#
# Montar este archivo (reemplaza el default de la imagen; DEBE incluir node{...}):
#   volumes:
#     - ../emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
#     - ../emqx/auth-file.csv:/opt/emqx/etc/auth-file.csv:ro
#     - ../emqx/acl-file.conf:/opt/emqx/etc/acl-file.conf:ro
# Validar antes de aplicar:  docker run --rm -it -v $PWD/infrastructure/emqx:/etc \
#   emqx/emqx:5.8.5 emqx check_config -c /etc/emqx.conf
