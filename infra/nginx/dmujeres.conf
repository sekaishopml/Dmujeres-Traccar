# Reverse proxy de produccion (referencia).
# Sirve el dashboard, la API/WebSocket y el canal de actualizaciones de la app.
server {
    listen 80;
    server_name _;

    # Dashboard (build del web)
    location / {
        root /var/www/dmujeres;
        try_files $uri $uri/ /index.html;
    }

    # API + WebSocket -> backend Traccar
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Canal de actualizaciones de la app Android (latest.json + APKs)
    # La app consulta {updateBaseUrl}/update/latest.json y descarga el APK.
    location /update/ {
        root /var/www/dmujeres-updates;   # aqui publish-update.sh deja latest.json y los .apk
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        types {
            application/json                       json;
            application/vnd.android.package-archive apk;
        }
    }
}

# Nota: el protocolo MQTT (puerto 8010) y OsmAnd (5055) van directos al backend,
# no a traves de Nginx (son TCP, no HTTP).
