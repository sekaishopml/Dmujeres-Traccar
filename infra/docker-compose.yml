# docker-compose de REFERENCIA para produccion/pruebas.
# En la VM del Cloud Agent los servicios corren de forma nativa (ver infra/scripts).
# Aqui se documenta el stack completo para despliegue con contenedores.
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${DB_PASSWORD:-traccar}
    volumes:
      - db_data:/home/postgres/pgdata/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traccar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    ports:
      - "1883:1883"

  server:
    build:
      context: ../server
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mqtt:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${DB_PASSWORD:-traccar}
    ports:
      - "8082:8082"   # API / web / websocket
      - "5055:5055"   # OsmAnd
      - "5000-5150:5000-5150" # rango de protocolos GPS

volumes:
  db_data:
  redis_data:
  mqtt_data:
